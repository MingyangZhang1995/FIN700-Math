project:
  type: book
  output-dir: _output

book:
  title: "FIN700: Bootcamp for PhD Finance"
  author: "Tingquan Pan, Mingyang Zhang"
  search: true
  repo-url: https://github.com/MingyangZhang1995/FIN700-Math
  chapters:
    - index.qmd
    - part: "Basic Knowledge in Finance"
      chapters:
        - notes/sections/finance/basic-knowledge.qmd
    - part: "Linear Algebra"
      chapters:
        - notes/sections/linear-algebra/vectors.qmd
        - notes/sections/linear-algebra/linear-maps.qmd
        - notes/sections/linear-algebra/decompositions.qmd
    - part: "Probability Theory"
      chapters:
        - notes/sections/probability/probability-space.qmd
        - notes/sections/probability/expectation.qmd
        - notes/sections/probability/common-distributions.qmd
        - notes/sections/probability/continuous-time.qmd
    - part: "Statistics"
      chapters:
        - notes/sections/statistics/introduction.qmd
    - part: "Empirical Methods"
      chapters:
        - notes\sections\empirical\1_identification_causality_strategies.qmd
        - notes\sections\empirical\2_regression_causal_inference.qmd
        - notes\sections\empirical\3_did.qmd
        - notes\sections\empirical\4_iv_rd.qmd

bibliography: references.bib

# Global defaults shared by every output format.
number-sections: true
number-depth: 2
crossref:
  chapters: true          # number theorems/equations/figures by chapter (e.g. 2.3)

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    html-math-method: mathjax
    code-fold: true
    fig-align: center
    
# Executable-code defaults. Notes use Python cells backed by the uv env.
jupyter: python3
execute:
  # `freeze` is intentionally disabled: this repo lives in a Dropbox-synced
  # folder, and Dropbox locks files under .quarto/_freeze, which makes Quarto's
  # freezer-pruning step crash on render. Leave it off unless the repo moves
  # off a syncing filesystem.
  freeze: false
  echo: true
  warning: false
